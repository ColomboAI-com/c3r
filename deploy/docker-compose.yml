# Declarative deployment of the C3R control-plane container (c3r-core).
# The GPU model backends (DeepSeek :8000, CLM :8700, Qwen :8090) run as their own
# containers and are NOT managed here; c3r-core reaches them over host loopback.
#
# Usage:
#   cp c3r-core.env.example c3r-core.env   # then fill C3R_BACKEND_TOKEN (chmod 600)
#   docker compose -f deploy/docker-compose.yml up -d
services:
  c3r-core:
    image: c3r-core:dev
    container_name: c3r-core-private
    network_mode: host          # reach DeepSeek/CLM/Qwen on 127.0.0.1; bind ingress :8088
    restart: unless-stopped
    env_file:
      - c3r-core.env
    volumes:
      - /mnt/c3r-models/c3r-access:/data/access   # persistent SQLite access store
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8088/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
