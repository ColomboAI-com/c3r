name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: image_build
        run: docker build --pull --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" --tag c3r:ci .
      - run: docker run --rm c3r:ci python -c 'import c3r.serve'
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: c3r:ci
          scanners: vuln
          format: json
          output: trivy-image.json
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan API image for secrets at every severity
        id: secret_scan
        if: always() && steps.image_build.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: c3r:ci
          scanners: secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-api-secrets-private.json
          exit-code: '1'
      - name: Record API secret counts without exporting matches
        if: always()
        run: |
          python .github/scripts/secret_summary.py --input trivy-api-secrets-private.json --output trivy-api-secret-summary.json --image-id "$(docker image inspect c3r:ci --format '{{.Id}}')" --source-commit "$(git rev-parse HEAD)" --image-source-commit "$(docker image inspect c3r:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" --scanner-outcome "${{ steps.secret_scan.outcome }}"
      - name: Preserve sanitized API secret summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-api-secret-summary-${{ github.run_id }}
          path: trivy-api-secret-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve scan findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-${{ github.run_id }}
          path: trivy-image.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve qualified API image with verified round trip
        if: success()
        run: |
          set -euo pipefail
          test ! -e c3r-api-image.tar
          original="$(docker image inspect c3r:ci --format '{{.Id}}')"
          source="$(git rev-parse HEAD)"
          revision="$(docker image inspect c3r:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$revision" = "$source"
          docker save --output c3r-api-image.tar c3r:ci
          archive_sha="$(sha256sum c3r-api-image.tar | cut -d ' ' -f 1)"
          docker image rm c3r:ci
          all_images="$(docker image ls --all --quiet --no-trunc)"
          while IFS= read -r image_id; do test "$image_id" != "$original"; done <<< "$all_images"
          docker load --input c3r-api-image.tar
          restored="$(docker image inspect c3r:ci --format '{{.Id}}')"
          test "$restored" = "$original"
          test "$(sha256sum c3r-api-image.tar | cut -d ' ' -f 1)" = "$archive_sha"
          python - "$original" "$archive_sha" "$source" <<'PY'
          import json, sys
          from pathlib import Path
          value = dict(image_id=sys.argv[1], archive_sha256=sys.argv[2], source_commit=sys.argv[3],
                       archive_bytes=Path('c3r-api-image.tar').stat().st_size, round_trip_verified=True,
                       registry_deployment_qualified=False, production_ready=False)
          Path('c3r-api-image-manifest.json').write_text(json.dumps(value, sort_keys=True)+'\n')
          PY
      - name: Upload qualified API build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: c3r-api-qualified-image-${{ github.run_id }}
          path: |
            c3r-api-image.tar
            c3r-api-image-manifest.json
          if-no-files-found: error
          retention-days: 30

  retention-image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: image_build
        run: docker build --pull --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" --file Dockerfile.retention --tag c3r-retention:ci .
      - name: Verify retention entrypoint
        run: |
          test "$(docker image inspect c3r-retention:ci --format '{{json .Config.Cmd}}')" = '["python","-m","c3r.retention_job"]'
      - run: docker run --rm c3r-retention:ci python -c 'import c3r.retention_job'
      - name: Scan retention image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: c3r-retention:ci
          scanners: vuln
          format: json
          output: trivy-retention-image.json
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan retention image for secrets at every severity
        id: secret_scan
        if: always() && steps.image_build.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: c3r-retention:ci
          scanners: secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-retention-secrets-private.json
          exit-code: '1'
      - name: Record retention secret counts without exporting matches
        if: always()
        run: |
          python .github/scripts/secret_summary.py --input trivy-retention-secrets-private.json --output trivy-retention-secret-summary.json --image-id "$(docker image inspect c3r-retention:ci --format '{{.Id}}')" --source-commit "$(git rev-parse HEAD)" --image-source-commit "$(docker image inspect c3r-retention:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" --scanner-outcome "${{ steps.secret_scan.outcome }}"
      - name: Preserve sanitized retention secret summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-retention-secret-summary-${{ github.run_id }}
          path: trivy-retention-secret-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve retention scan findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-retention-image-${{ github.run_id }}
          path: trivy-retention-image.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve qualified retention image with verified round trip
        if: success()
        run: |
          set -euo pipefail
          test ! -e c3r-retention-image.tar
          original="$(docker image inspect c3r-retention:ci --format '{{.Id}}')"
          source="$(git rev-parse HEAD)"
          revision="$(docker image inspect c3r-retention:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$revision" = "$source"
          docker save --output c3r-retention-image.tar c3r-retention:ci
          archive_sha="$(sha256sum c3r-retention-image.tar | cut -d ' ' -f 1)"
          docker image rm c3r-retention:ci
          all_images="$(docker image ls --all --quiet --no-trunc)"
          while IFS= read -r image_id; do test "$image_id" != "$original"; done <<< "$all_images"
          docker load --input c3r-retention-image.tar
          restored="$(docker image inspect c3r-retention:ci --format '{{.Id}}')"
          test "$restored" = "$original"
          test "$(sha256sum c3r-retention-image.tar | cut -d ' ' -f 1)" = "$archive_sha"
          python - "$original" "$archive_sha" "$source" <<'PY'
          import json, sys
          from pathlib import Path
          value = dict(image_id=sys.argv[1], archive_sha256=sys.argv[2], source_commit=sys.argv[3],
                       archive_bytes=Path('c3r-retention-image.tar').stat().st_size, round_trip_verified=True,
                       registry_deployment_qualified=False, production_ready=False)
          Path('c3r-retention-image-manifest.json').write_text(json.dumps(value, sort_keys=True)+'\n')
          PY
      - name: Upload qualified retention build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: c3r-retention-qualified-image-${{ github.run_id }}
          path: |
            c3r-retention-image.tar
            c3r-retention-image-manifest.json
          if-no-files-found: error
          retention-days: 30
